{% extends "base.html" %}

{% block title %}Author Signup | CMT Portal{% endblock %}

{% block content %}
<div class="page-header" style="text-align: center; justify-content: center;">
  <div class="page-title">
    <h2><i class="fa-solid fa-user-plus" style="color: var(--primary-blue);"></i> Register Author Account</h2>
    <p>Create a participant account to submit papers, track abstract reviews, and manage registration receipts.</p>
  </div>
</div>

<div class="form-card" style="max-width: 550px; margin: 0 auto;">
  <form action="{{ url_for('signup') }}" method="POST">
    
    <div class="form-group">
      <label class="form-label" for="name"><i class="fa-solid fa-user"></i> Full Name <span style="color: var(--danger-red);">*</span></label>
      <input type="text" name="name" id="name" class="form-control" placeholder="e.g. Dr. Aarav Sharma" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="email"><i class="fa-solid fa-envelope"></i> Email Address <span style="color: var(--danger-red);">*</span></label>
      <input type="email" name="email" id="email" class="form-control" placeholder="e.g. author@domain.com" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> Password <span style="color: var(--danger-red);">*</span></label>
      <input type="password" name="password" id="password" class="form-control" placeholder="Choose a secure password" required>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="institution"><i class="fa-solid fa-building-columns"></i> University / Institution</label>
        <input type="text" name="institution" id="institution" class="form-control" placeholder="e.g. LJKU">
      </div>
      <div class="form-group">
        <label class="form-label" for="phone"><i class="fa-solid fa-phone"></i> Phone Number</label>
        <input type="tel" name="phone" id="phone" class="form-control" placeholder="+91 9876543210">
      </div>
    </div>

    <button type="submit" class="btn btn-gold btn-block" style="padding: 12px; font-size: 1rem; margin-top: 10px;">
      <i class="fa-solid fa-user-plus"></i> Create Account & Proceed
    </button>
  </form>

  <div style="margin-top: 20px; text-align: center; font-size: 0.88rem;">
    Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary-blue); font-weight: 700; text-decoration: none;">Login here</a>
  </div>
</div>
{% endblock %}
