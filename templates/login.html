{% extends "base.html" %}

{% block title %}Login | CMT Portal{% endblock %}

{% block content %}
<div class="page-header" style="text-align: center; justify-content: center;">
  <div class="page-title">
    <h2><i class="fa-solid fa-right-to-bracket" style="color: var(--primary-blue);"></i> Centralized Account Login</h2>
    <p>Access your author dashboard or administrator portal using your registered credentials.</p>
  </div>
</div>

<div class="form-card" style="max-width: 480px; margin: 0 auto;">
  <form action="{{ url_for('login', next=request.args.get('next', '')) }}" method="POST">
    
    <div class="form-group">
      <label class="form-label" for="email">
        <i class="fa-solid fa-envelope"></i> Email Address (Admin / Author ID)
      </label>
      <input type="email" name="email" id="login_email" class="form-control" placeholder="e.g. author@domain.com or admin@ljku.edu.in" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">
        <i class="fa-solid fa-lock"></i> Password
      </label>
      <input type="password" name="password" id="login_password" class="form-control" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="padding: 12px; font-size: 1rem;">
      <i class="fa-solid fa-right-to-bracket"></i> Login
    </button>
  </form>

  <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-light); text-align: center; font-size: 0.88rem;">
    Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--primary-blue); font-weight: 700; text-decoration: none;">Create Author Account</a>
  </div>

  <!-- Demo Accounts Quick Filler Widget -->
  <div style="margin-top: 20px; background: #F8FAFC; border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 14px; font-size: 0.8rem;">
    <div style="font-weight: 700; color: var(--primary-navy); margin-bottom: 6px;">
      <i class="fa-solid fa-key" style="color: var(--accent-gold);"></i> Quick Demo Credentials:
    </div>
    <div style="display: flex; gap: 8px;">
      <button type="button" class="btn btn-outline btn-sm" style="flex: 1; font-size: 0.75rem;" 
              onclick="document.getElementById('login_email').value='admin@ljku.edu.in'; document.getElementById('login_password').value='admin123';">
        <i class="fa-solid fa-user-shield"></i> Fill Admin Login
      </button>
      <button type="button" class="btn btn-outline btn-sm" style="flex: 1; font-size: 0.75rem;" 
              onclick="document.getElementById('login_email').value='aarav.sharma@example.edu'; document.getElementById('login_password').value='user123';">
        <i class="fa-solid fa-user"></i> Fill Author Login
      </button>
    </div>
  </div>

</div>
{% endblock %}
